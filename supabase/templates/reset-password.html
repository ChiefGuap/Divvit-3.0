<!-- Supabase → Authentication → Email Templates → "Reset Password".  Subject: Reset your Divvit password -->
<div style="font-family:Inter,Arial,sans-serif;color:#111;max-width:620px">
  <h2 style="margin:0 0 10px">Reset your password</h2>
  <p style="margin:0 0 10px;color:#333;line-height:1.5">Someone asked to reset the password for your Divvit account. Click below to choose a new one. The link works once.</p>
  <p style="margin:22px 0 0"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#8c52ff;color:#fff;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:10px">Choose a new password</a></p>
  <p style="margin:22px 0 0;color:#777;font-size:13px">If you didn't ask for this, ignore this email and your password won't change.</p>
</div>

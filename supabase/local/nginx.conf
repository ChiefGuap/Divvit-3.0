# Presents the local Postgres + PostgREST pair at Supabase's URL shape, so the
# dashboard's supabase-js client works unmodified against it.
#
# supabase-js hard-codes /rest/v1 and /auth/v1 prefixes; PostgREST serves at
# root and there is no local GoTrue. Rewriting here means no code branches on
# "are we local?" — the app cannot tell the difference, which is the point.
server {
    listen 8000;

    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Accept-Profile public;
        proxy_set_header Content-Profile public;
    }

    # No GoTrue locally. The dashboard reads are anonymous, so an empty session
    # is the honest answer rather than a fabricated user.
    location /auth/v1/user   { return 401 '{"message":"no local auth"}'; }
    location /auth/v1/       { default_type application/json; return 200 '{}'; }
    location /               { return 404 '{"message":"not found"}'; }
}
